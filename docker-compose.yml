version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: gokulkrishnan
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app1:
    build: .
    # container_name: my_app
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      CONTAINER_NAME: app1
    # ports:
    #   - "8080:8080"

  app2:
    build: .
    # container_name: my_app
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      CONTAINER_NAME: app2
    # ports:
    #   - "8081:8080"

  app3:
    build: .
    # container_name: my_app
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      CONTAINER_NAME: app3
    # ports:
    #   - "8082:8080"

  nginx:
    image: nginx:latest
    container_name: nginx_lb
    depends_on:
      - app1
      - app2
      - app3
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro


  

volumes:
  postgres_data:
